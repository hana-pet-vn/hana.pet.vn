<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hana Pet — Kênh người bán (Demo v2)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1b295b; --navy-deep:#0d142e; --navy-soft:#eef1fa;
  --ink:#1c2440; --muted:#5f6c8f; --line:#dbe2f1;
  --bg:#f4f6fb; --card:#ffffff;
  --ok:#16a34a; --ok-bg:#f0fdf4; --warn:#d97706; --warn-bg:#fffbeb;
  --bad:#dc2626; --bad-bg:#fef2f2; --info:#2563eb; --info-bg:#eff6ff;
  --ship:#0891b2; --ship-bg:#ecfeff; --pack:#7c3aed; --pack-bg:#f5f3ff;
  --ft:'Baloo 2','Be Vietnam Pro',sans-serif; --fb:'Be Vietnam Pro',sans-serif;
  --r:12px; --shadow:0 1px 3px rgba(13,20,46,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);font-size:13px}
button{font-family:inherit;cursor:pointer} input,select,textarea{font-family:inherit}

.app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;height:100vh}
.topbar{grid-column:1/3;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--ft);font-weight:800;font-size:16px}
.brand .sub{font-weight:600;font-size:11px;opacity:.65;letter-spacing:.4px}
.logo{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--navy);display:grid;place-items:center;font-family:var(--ft);font-weight:800;font-size:15px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.bell{position:relative;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:15px}
.bell::after{content:"";position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#ff5a5f;border:2px solid var(--navy)}
.role-switch{display:flex;background:rgba(255,255,255,.12);border-radius:9px;padding:3px;gap:2px}
.role-switch button{border:none;background:transparent;color:rgba(255,255,255,.75);font-family:var(--ft);font-weight:700;font-size:12px;padding:5px 12px;border-radius:7px}
.role-switch button.on{background:#fff;color:var(--navy)}
.avatar{width:32px;height:32px;border-radius:50%;background:#ffd166;color:var(--navy);display:grid;place-items:center;font-family:var(--ft);font-weight:800;font-size:12px}

.side{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side .group{font-family:var(--ft);font-size:10px;font-weight:700;color:#9aa5c4;letter-spacing:1.2px;padding:12px 12px 5px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-family:var(--ft);font-weight:700;font-size:13px;width:100%;text-align:left;position:relative}
.nav .ico{width:20px;text-align:center;font-size:15px}
.nav:hover{background:var(--navy-soft)} .nav.on{background:var(--navy);color:#fff}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;font-family:var(--fb)}
.lock-note{margin-top:auto;background:var(--navy-soft);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--muted);line-height:1.5}
.lock-note b{color:var(--navy)}

.main{overflow-y:auto;padding:20px 24px 60px}
.crumb{font-family:var(--ft);font-weight:800;font-size:19px;color:var(--navy-deep);margin-bottom:2px}
.crumb-sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.card.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.click:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(13,20,46,.1)}
.card .lbl{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.card .val{font-family:var(--ft);font-weight:800;font-size:25px;color:var(--navy-deep)}
.card .val.warn{color:var(--warn)} .card .val.bad{color:var(--bad)}
.card .hint{font-size:11px;color:var(--muted);margin-top:4px}
.remind{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:8px;border:1px solid var(--line);background:var(--card)}
.remind.due{background:var(--warn-bg);border-color:#f3d9a4;color:#92400e}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel + .panel{margin-top:14px}
.panel-h{padding:13px 16px;border-bottom:1px solid var(--line);font-family:var(--ft);font-weight:700;font-size:13px;color:var(--navy-deep);display:flex;align-items:center;gap:8px}
.panel-h .sp{margin-left:auto}

.stabs{display:flex;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:var(--r) var(--r) 0 0;overflow-x:auto}
.stab{border:none;background:transparent;padding:13px 15px;font-family:var(--ft);font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:6px}
.stab:hover{color:var(--navy)} .stab.on{color:var(--navy);border-bottom-color:var(--navy)}
.stab .n{background:var(--bad);color:#fff;font-family:var(--fb);font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px}
.stab .n.gray{background:#e7ebf5;color:var(--muted)}
.filters{background:var(--card);border:1px solid var(--line);border-top:none;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.search input{border:none;background:transparent;outline:none;width:100%;font-size:13px;color:var(--ink)}
.fsel{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--muted)}
.btn{border:none;border-radius:9px;padding:9px 15px;font-family:var(--ft);font-weight:700;font-size:12.5px}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:#233573}
.btn-line{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.btn-line:hover{border-color:var(--navy)}
.btn-ghost{background:var(--navy-soft);color:var(--navy)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}

table{width:100%;border-collapse:collapse}
th{font-family:var(--ft);font-size:10.5px;font-weight:700;color:var(--muted);text-align:left;padding:10px 12px;background:#fafbfe;border-bottom:1px solid var(--line);letter-spacing:.3px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #edf0f8;vertical-align:middle}
tr.rowlink{cursor:pointer}tr.rowlink:hover td{background:#fafbff}
tr:last-child td{border-bottom:none}
.pline{display:flex;align-items:center;gap:10px}
.pimg{width:36px;height:36px;border-radius:9px;background:var(--navy-soft);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.pname{font-weight:600;font-size:12.5px} .psub{font-size:11px;color:var(--muted)}
.money{font-family:var(--ft);font-weight:700;color:var(--navy-deep);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-family:var(--ft);font-weight:700;font-size:11px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%}
.chip{display:inline-block;min-width:44px;text-align:center;font-family:var(--ft);font-weight:700;font-size:12.5px;border:1.5px dashed var(--line);border-radius:8px;padding:4px 8px;cursor:text}
.chip:hover{border-color:var(--navy);background:var(--navy-soft)}
.chip.low{color:var(--warn);border-color:#f3d9a4} .chip.zero{color:var(--bad);border-color:#f3b4b4}
.chip.miss{color:var(--bad);border-color:var(--bad);border-style:solid;font-size:10.5px}
.chip.lock{cursor:not-allowed;border-style:solid;color:var(--muted);background:#f6f7fb}
.chip-in{width:70px;font-family:var(--ft);font-weight:700;font-size:12.5px;text-align:center;border:1.5px solid var(--navy);border-radius:8px;padding:4px 6px;outline:none}
.checkbox{width:15px;height:15px;accent-color:var(--navy);cursor:pointer}
/* ── Bảng quy trình gắn tường ─────────── */
.guide{background:linear-gradient(135deg,#eef1fa,#f7f9ff);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.guide-h{display:flex;align-items:center;gap:8px;font-family:var(--ft);font-weight:700;font-size:12.5px;color:var(--navy);cursor:pointer}
.guide-h .tg{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.gsteps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gstep{display:flex;align-items:flex-start;gap:7px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:11.5px;line-height:1.45;max-width:240px}
.gstep.act{cursor:pointer}
.gstep.act:hover{border-color:var(--navy);box-shadow:0 3px 10px rgba(27,41,91,.1)}
.gstep .n{width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--ft);font-weight:800;font-size:10px;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.gstep .n.auto{background:var(--ok)}
.gstep b{color:var(--navy-deep)}
.gstep .go{font-size:10px;color:var(--info);font-family:var(--ft);font-weight:700}
.bulk{position:sticky;bottom:0;background:var(--navy-deep);color:#fff;border-radius:var(--r);padding:11px 16px;display:flex;align-items:center;gap:12px;margin-top:14px;box-shadow:0 -4px 20px rgba(13,20,46,.25);animation:up .18s ease}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.bulk b{font-family:var(--ft)}
.back{border:none;background:var(--navy-soft);color:var(--navy);font-family:var(--ft);font-weight:700;font-size:12.5px;border-radius:9px;padding:8px 14px;margin-bottom:14px}
.pipe{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 2px}
.pstep{display:flex;align-items:center;flex-shrink:0}
.pball{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:#d7ddec;margin:0 auto 5px}
.pstep.done .pball{background:var(--ok)} .pstep.now .pball{background:var(--navy)}
.plab{font-family:var(--ft);font-size:10.5px;font-weight:700;color:var(--muted);max-width:76px;text-align:center;line-height:1.25}
.pstep.done .plab{color:var(--ok)} .pstep.now .plab{color:var(--navy)}
.pcon{width:34px;height:2.5px;background:#d7ddec;margin:14px 4px 0;flex-shrink:0}
.pcon.done{background:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{font-size:12.5px;line-height:1.9}.kv b{color:var(--navy-deep)}.kv .k{color:var(--muted);display:inline-block;min-width:96px}
.note-box{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;min-height:64px;resize:vertical;outline:none}
.note-box:focus{border-color:var(--navy)}

.tgl{position:relative;width:40px;height:22px;border-radius:20px;background:#cfd6e8;border:none;transition:.15s;flex-shrink:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on{background:var(--ok)} .tgl.on::after{left:20px}
.sw-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid #edf0f8}
.sw-row:last-child{border-bottom:none}
.sw-row .t{font-family:var(--ft);font-weight:700;font-size:13px;color:var(--navy-deep)}
.sw-row .d{font-size:11.5px;color:var(--muted);margin-top:2px}

.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sec-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.sec-card .ord{font-family:var(--ft);font-weight:800;font-size:11px;color:#9aa5c4;letter-spacing:1px}
.sec-card h4{font-family:var(--ft);font-size:14px;color:var(--navy-deep);margin:4px 0 6px}
.sec-card p{font-size:11.5px;color:var(--muted);line-height:1.55;margin-bottom:10px}
.sec-card .meta{font-size:10.5px;color:#9aa5c4;margin-bottom:10px}
.sec-warn{background:var(--bad-bg);border:1px solid #f0c4c4;color:var(--bad);border-radius:8px;padding:7px 10px;font-size:11px;margin-bottom:10px}

.overlay{position:fixed;inset:0;background:rgba(13,20,46,.45);display:grid;place-items:center;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:16px;width:min(660px,92vw);max-height:86vh;overflow-y:auto;padding:20px}
.modal h3{font-family:var(--ft);color:var(--navy-deep);font-size:16px;margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.preview-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;font-size:12.5px;flex-wrap:wrap}
.arr{color:var(--muted)}
.blk-h{font-family:var(--ft);font-weight:700;font-size:12px;color:var(--navy-deep);margin:12px 0 7px}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--navy-deep);color:#fff;font-family:var(--ft);font-weight:600;font-size:13px;border-radius:10px;padding:10px 18px;box-shadow:0 8px 24px rgba(13,20,46,.3);animation:up .2s;max-width:90vw;text-align:center}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px}
.empty b{display:block;font-family:var(--ft);color:var(--navy);font-size:14px;margin-bottom:4px}
/* ── Trình trang trí (Shopee-style) ────── */
.deco{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
.deco-left{display:flex;flex-direction:column;gap:8px}
.dsec{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.dsec.sel{border-color:var(--navy);box-shadow:0 0 0 2px rgba(27,41,91,.12)}
.dsec.ghost{opacity:.55}
.dsec-h{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer;font-family:var(--ft);font-size:12.5px;color:var(--navy-deep)}
.dsec-h:hover{background:var(--navy-soft)}
.dsec-ctl{margin-left:auto;display:flex;gap:3px}
.dsec-ctl button{border:1px solid var(--line);background:#fff;border-radius:7px;width:26px;height:26px;font-size:12px}
.dsec-ctl button:hover{border-color:var(--navy)}
.dsec-b{padding:4px 13px 12px;border-top:1px solid #edf0f8}
.dfield{margin:9px 0}
.dfield label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.dimg{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--line);border-radius:9px;padding:7px 10px}
.dev-switch{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.dev-switch button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-family:var(--ft);font-weight:700;font-size:12px;color:var(--muted)}
.dev-switch button.on{border-color:var(--navy);color:var(--navy);background:var(--navy-soft)}
.phone-wrap{display:flex;justify-content:center;background:repeating-conic-gradient(#eef1f8 0 25%,#f6f8fd 0 50%) 0 0/22px 22px;border:1px solid var(--line);border-radius:14px;padding:22px 12px;min-height:480px}
.phone{background:#fff;border:6px solid var(--navy-deep);border-radius:24px;width:300px;height:520px;overflow-y:auto;position:relative;box-shadow:0 16px 40px rgba(13,20,46,.22);transition:width .2s}
.phone.desktop{width:min(560px,100%);height:520px;border-radius:12px;border-width:4px}
.pv-top{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid #eef1f8;font-family:var(--ft);font-size:12px;color:var(--navy);position:sticky;top:0;background:#fff;z-index:2}
.pv-logo{width:18px;height:18px;border-radius:5px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10px;font-family:var(--ft);font-weight:800}
.pv-hero{background:linear-gradient(135deg,#1b295b,#33488f);color:#fff;padding:26px 16px;text-align:center}
.pv-hero-t{font-family:var(--ft);font-weight:800;font-size:16px;line-height:1.3}
.pv-hero-s{font-size:10.5px;opacity:.85;margin:6px 0 12px}
.pv-cta{display:inline-block;background:#ffd166;color:var(--navy-deep);font-family:var(--ft);font-weight:800;font-size:11px;border-radius:18px;padding:6px 16px}
.pv-sec{padding:16px 12px}.pv-sec.alt{background:#f6f8fd}
.pv-h2{font-family:var(--ft);font-weight:800;font-size:13px;color:var(--navy-deep);text-align:center;margin-bottom:10px}
.pv-cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pv-card{width:82px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-size:9px;color:var(--ink)}
.pv-card-img{font-size:22px;background:var(--navy-soft);border-radius:8px;padding:8px 0;margin-bottom:5px}
.pv-card.dead{border:1.5px dashed var(--bad);color:var(--bad);display:grid;place-items:center;min-height:76px;font-size:14px}
.pv-card.dead span{font-size:8.5px}
.pv-video{background:#10142b;border-radius:10px;height:110px;display:grid;place-items:center;color:#fff;font-size:22px;margin-bottom:6px;position:relative}
.pv-video-w{position:absolute;bottom:6px;left:8px;font-size:9px;opacity:.85}
.pv-quote{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:9.5px;color:var(--ink);margin-bottom:6px;font-style:italic}
.pv-p{font-size:10px;color:var(--muted);line-height:1.6;text-align:center}
.pv-foot{background:var(--navy-deep);color:#fff;padding:14px 12px;font-size:9.5px;line-height:1.8}
.pv-mascot{position:sticky;bottom:6px;margin-left:auto;width:34px;height:34px;border-radius:50%;background:#ffd166;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 10px rgba(0,0,0,.2);margin-right:8px}
@media(max-width:1050px){.deco{grid-template-columns:1fr}.phone-wrap{min-height:auto}}
@media(max-width:900px){
  .app{grid-template-columns:64px 1fr}
  .side .group,.nav span.txt,.lock-note{display:none}
  .nav{justify-content:center;padding:11px 0}.nav .cnt{position:absolute;top:4px;right:8px;margin:0}
  .brand .sub{display:none}.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">H</div><div>Hana Pet <span class="sub">KÊNH NGƯỜI BÁN · DEMO V2</span></div></div>
    <div class="top-right">
      <div class="role-switch" title="Demo phân quyền — bấm để đổi vai">
        <button id="role-owner" class="on" onclick="setRole('owner')">👑 Chủ shop</button>
        <button id="role-staff" onclick="setRole('staff')">🧑‍💼 Nhân viên</button>
      </div>
      <button class="bell">🔔</button>
      <div class="avatar" id="avatar">T</div>
    </div>
  </header>
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
/* ══ DATA ═════════════════════════════════ */
const PRODUCTS = [

function editChip(el,kind,sku){
  const cur=el.textContent.replace(/[^\d]/g,'')||'';
  const inp=document.createElement('input');
  inp.className='chip-in';inp.value=kind==='sku'?(el.classList.contains('miss')?'':el.textContent.trim()):cur;
  if(kind!=='sku'){inp.type='number';inp.min=0}else{inp.style.width='120px'}
  el.replaceWith(inp);inp.focus();inp.select();
  const save=()=>{
    const v=inp.value.trim();
    for(const p of PRODUCTS){
      const hit = p.variants?p.variants.find(x=>x.id===sku):(p.id.toUpperCase()===sku?p:null);
      if(!hit)continue;
      if(kind==='stock'){if(p.variants)hit.stock=+v||0;else p.stock=+v||0;toast(`📦 ${sku} → tồn ${+v||0} (nhớ: sẽ bị ghi đè ở lần đồng bộ tới)`)}
      if(kind==='sku'){if(p.variants)hit.skuBS=v;else p.skuBS=v;toast(v?`🏷️ ${sku} ↔ ${v}`:`🏷️ Đã xoá ánh xạ của ${sku}`)}
      if(kind==='safe'){p.safe=+v||0;toast(`🛡️ Ngưỡng ngừng bán của ${p.name}: ${+v||0}`)}
      if(kind==='price'){p.price=+v||p.price;toast(`💰 Giá mới: ${fmt(p.price)}`)}
    }
    render();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')save();if(e.key==='Escape')render()});
  inp.addEventListener('blur',save);
}

  const F=k=>{const s=STORE.find(x=>x.key===k);return s?s.f:{}};
  const parts=STORE.filter(s=>!s.hide).map(s=>{
    if(s.key==='hero')return `<div class="pv-hero"><div class="pv-hero-t">${s.f['Tiêu đề lớn']||''}</div>
      <div class="pv-hero-s">${s.f['Dòng phụ']||''}</div><span class="pv-cta">${s.f['Chữ trên nút']||'Mua ngay'}</span></div>`;
    if(s.key==='sp'){
      const cards=PIN.map(id=>{const it=findItem(id);if(!it)return '';
        return it.archived?`<div class="pv-card dead">⚠<br><span>đã ngừng bán</span></div>`
          :`<div class="pv-card"><div class="pv-card-img">${it.icon}</div><span>${it.name}</span></div>`}).join('');
      return `<div class="pv-sec"><div class="pv-h2">${s.f['Tiêu đề khu']||''}</div>
        <div class="pv-cards">${cards||'<div class="psub">（chưa ghim món nào）</div>'}</div></div>`;
    }
    if(s.key==='tm')return `<div class="pv-sec alt"><div class="pv-h2">${s.f['Tiêu đề khu']||''}</div>
      ${s.rows.map(r=>r.link
        ?`<div class="pv-video">▶<div class="pv-video-w">${r.who||'@video'}</div></div>`
        :`<div class="pv-quote">“${r.quote}”<br><span style="opacity:.65;font-style:normal">${r.who}</span></div>`).join('')}</div>`;
    if(s.key==='ab')return `<div class="pv-sec"><div class="pv-h2">${s.f['Tiêu đề']||''}</div>
      <div class="pv-p">${s.f['Đoạn giới thiệu']||''}</div></div>`;
    if(s.key==='txt')return `<div class="pv-foot"><b>📞 ${s.f['Hotline']||''}</b><div>${s.f['Địa chỉ footer']||''}</div><div style="opacity:.6">${s.f['Dòng bản quyền']||''}</div></div>`;
    return '';
  }).join('');
  return `<div class="pv-top"><span class="pv-logo">H</span><b>${BRAND.f['Tên hiển thị']}</b><span style="margin-left:auto;font-size:9px">☰</span></div>
    ${parts}${S.mascot?'<div class="pv-mascot">🐱</div>':''}`;
}

/* ══ CÀI ĐẶT ══════════════════════════════ */

  return `
  <div class="crumb">Cài đặt</div>

  <div class="panel"><div class="panel-h">🎚️ Phân quyền nhân viên <span class="sp" style="font-weight:400;font-size:11px;color:var(--muted)">áp cho MỌI nhân viên · khoá thật nằm ở database</span></div>
    ${SW_DEF.map(([k,t,d])=>`<div class="sw-row">
      <button class="tgl ${S.SW[k]?'on':''}" onclick="S.SW['${k}']=!S.SW['${k}'];toast(S.SW['${k}']?'🟢 BẬT: ${t}':'⚪ TẮT: ${t}');render()"></button>
      <div><div class="t">${t}</div><div class="d">${d}</div></div>
      <span style="margin-left:auto" class="badge" style="background:#eef0f6;color:var(--muted)">${S.SW[k]?'':''}</span>
    </div>`).join('')}
  </div>
  <div class="panel"><div class="panel-h">👥 Tài khoản nhân viên</div>
    <table><tr><th>Email</th><th>Vai</th><th>Đăng nhập cuối</th><th>Trạng thái</th><th style="text-align:right">Thao tác</th></tr>
    ${STAFFS.map((s,i)=>`<tr>
      <td><b>${s.email}</b></td>
      <td>${s.role==='owner'?'<span class="badge" style="background:var(--navy);color:#fff">👑 Chủ shop</span>':'<span class="badge" style="background:var(--navy-soft);color:var(--navy)">Nhân viên</span>'}</td>
      <td class="psub">${s.last}</td>
      <td>${s.banned?'<span class="badge" style="color:var(--bad);background:var(--bad-bg)">Đã khoá</span>':'<span class="badge" style="color:var(--ok);background:var(--ok-bg)">Hoạt động</span>'}</td>
      <td style="text-align:right">${s.role==='owner'?'<span class="psub">không tự khoá được mình</span>'
        :`<button class="btn btn-line btn-sm" onclick="STAFFS[${i}].banned=!STAFFS[${i}].banned;toast(STAFFS[${i}].banned?'⛔ Đã khoá — hết đăng nhập được ngay':'✅ Đã mở lại');render()">${s.banned?'Mở khoá':'Khoá'}</button>`}</td></tr>`).join('')}
    </table>
    <div style="display:flex;gap:9px;padding:13px 16px;border-top:1px solid var(--line)">
      <input id="invite-email" class="note-box" style="min-height:auto;flex:1" placeholder="Email nhân viên mới — họ sẽ nhận email mời tự đặt mật khẩu (không ai nhìn thấy mật khẩu của ai)">
      <button class="btn btn-navy" onclick="const e=document.getElementById('invite-email').value.trim();if(!e){toast('Nhập email trước đã');return}STAFFS.push({email:e,role:'staff',last:'— (đã gửi lời mời)',banned:false});toast('📧 Đã gửi email mời tới '+e);render()">Gửi lời mời</button>
    </div>
  </div>`;
}

/* ══ MODAL + TOAST ════════════════════════ */
function openModal(h){document.getElementById('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${h}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity=0;setTimeout(()=>t.remove(),320)},2800)}
render();
</script>
